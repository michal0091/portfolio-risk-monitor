# Tracked positions — copy to cfg/positions.yaml and edit. cfg/positions.yaml is git-ignored.
# Example positions, not a real portfolio.
#
# id:          short name used for files and charts (letters, digits, underscore)
# ticker:      Yahoo Finance symbol (funds: Morningstar code such as 0P0000XXXX.F)
# currency:    trading currency of the ticker (EUR, USD, GBP...); converted to EUR with Yahoo FX
# withholding: tax withheld on dividends, as a fraction (optional, default 0)
# lots:        one entry per purchase; a sale is a lot with negative shares
#   date, shares, price (in the ticker currency, as paid, before any later split),
#   fees (EUR, optional)

positions:
  - id: santander
    name: "Banco Santander"
    ticker: "SAN.MC"
    type: stock
    currency: EUR
    withholding: 0.19
    lots:
      - {date: "2023-03-15", shares: 300, price: 3.40, fees: 4}
      - {date: "2024-08-05", shares: 200, price: 4.20, fees: 4}

  - id: microsoft
